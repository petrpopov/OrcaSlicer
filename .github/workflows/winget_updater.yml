name: Publish to WinGet
on:
  release:
    types: [ released ]
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Validate WinGet token
        id: validate_token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            "valid=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host "::notice::Skipping WinGet publish because WINGET_TOKEN is not configured."
            exit 0
          }

          try {
            Invoke-RestMethod -Uri "https://api.github.com/user" -Headers @{
              Authorization = "Bearer $env:WINGET_TOKEN"
              "User-Agent" = "OrcaSlicer"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } | Out-Null
            "valid=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          } catch {
            "valid=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host "::warning::Skipping WinGet publish because WINGET_TOKEN is invalid."
          }

      - uses: vedantmgoyal9/winget-releaser@main
        if: ${{ steps.validate_token.outputs.valid == 'true' }}
        with:
          identifier: SoftFever.OrcaSlicer
          version: ${{ github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: '\.exe$'
