name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: "main"
        type: string
      publish_release:
        description: "Publish DMG to GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag name when publish_release=true (example: v2.3.2-pe.1)"
        required: false
        default: ""
        type: string
      notarize:
        description: "Sign and notarize the DMG (requires Apple/codesign secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos-dmg-${{ github.event_name }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build-macos-dmg:
    runs-on: macos-14
    env:
      APP_BUNDLE_NAME: OrcaSlicerPE
      APP_BINARY_NAME: OrcaSlicerPE
      DEPLOYMENT_TARGET: "10.15"
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
      APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_PWD: ${{ secrets.APP_PWD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}
          lfs: "true"

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Resolve release metadata
        shell: bash
        run: |
          version_from_inc=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="build-${version_from_inc}-${GITHUB_RUN_NUMBER}"
          fi

          dmg_name="${APP_BUNDLE_NAME}_Mac_universal_${release_tag}.dmg"

          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${dmg_name}" >> "$GITHUB_ENV"

      - name: Validate release input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag == '' }}
        shell: bash
        run: |
          echo "release_tag is required when publish_release=true"
          exit 1

      - name: Cache deps
        id: cache_deps
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build
          key: macos-deps-universal-${{ hashFiles('deps/CMakeLists.txt', 'deps/*.cmake') }}
          restore-keys: |
            macos-deps-universal-

      - name: Install build tools (autotools)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install autoconf automake texinfo libtool

      - name: Build deps arm64
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./build_release_macos.sh -dx -1 -a arm64 -t "${DEPLOYMENT_TARGET}"

      - name: Build deps x86_64
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          arch -x86_64 ./build_release_macos.sh -dx -1 -a x86_64 -t "${DEPLOYMENT_TARGET}"

      - name: Build OrcaSlicerPE arm64
        shell: bash
        run: |
          ./build_release_macos.sh -s -x -1 -a arm64 -t "${DEPLOYMENT_TARGET}"

      - name: Build OrcaSlicerPE x86_64
        shell: bash
        run: |
          arch -x86_64 ./build_release_macos.sh -s -x -1 -a x86_64 -t "${DEPLOYMENT_TARGET}"

      - name: Build OrcaSlicerPE (universal)
        shell: bash
        run: |
          ./build_release_macos.sh -u -x -1 -a universal -t "${DEPLOYMENT_TARGET}"

      - name: Resolve signing/notarization availability
        id: signing_state
        shell: bash
        run: |
          can_sign=false
          can_notarize=false

          if [[ -n "${BUILD_CERTIFICATE_BASE64}" && -n "${P12_PASSWORD}" && -n "${KEYCHAIN_PASSWORD}" && -n "${CERTIFICATE_ID}" ]]; then
            can_sign=true
          fi

          if [[ -n "${APPLE_DEV_ACCOUNT}" && -n "${TEAM_ID}" && -n "${APP_PWD}" ]]; then
            can_notarize=true
          fi

          echo "can_sign=${can_sign}" >> "$GITHUB_OUTPUT"
          echo "can_notarize=${can_notarize}" >> "$GITHUB_OUTPUT"

      - name: Sign app bundle
        if: ${{ (github.event_name == 'push' || inputs.notarize) && steps.signing_state.outputs.can_sign == 'true' }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          APP_PATH="${{ github.workspace }}/build/universal/OrcaSlicer/${APP_BUNDLE_NAME}.app"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"

          codesign --deep --force --verbose --options runtime --timestamp \
            --entitlements "${{ github.workspace }}/scripts/disable_validation.entitlements" \
            --sign "$CERTIFICATE_ID" "$APP_PATH"

      - name: Create DMG
        shell: bash
        run: |
          DMG_DIR="${{ github.workspace }}/build/universal/OrcaSlicer_dmg"
          APP_PATH="${{ github.workspace }}/build/universal/OrcaSlicer/${APP_BUNDLE_NAME}.app"

          mkdir -p "$DMG_DIR"
          rm -rf "$DMG_DIR"/*
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -sfn /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "${APP_BUNDLE_NAME}" -srcfolder "$DMG_DIR" -ov -format UDZO "${DMG_NAME}"

      - name: Sign DMG
        if: ${{ (github.event_name == 'push' || inputs.notarize) && steps.signing_state.outputs.can_sign == 'true' }}
        shell: bash
        run: |
          codesign --deep --force --verbose --options runtime --timestamp \
            --entitlements "${{ github.workspace }}/scripts/disable_validation.entitlements" \
            --sign "$CERTIFICATE_ID" "${DMG_NAME}"

      - name: Notarize DMG
        if: ${{ (github.event_name == 'push' || inputs.notarize) && steps.signing_state.outputs.can_notarize == 'true' }}
        shell: bash
        run: |
          xcrun notarytool submit "${DMG_NAME}" \
            --apple-id "${APPLE_DEV_ACCOUNT}" \
            --team-id "${TEAM_ID}" \
            --password "${APP_PWD}" \
            --wait
          xcrun stapler staple "${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ github.workspace }}/${{ env.DMG_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name != 'push' }}
          files: ${{ github.workspace }}/${{ env.DMG_NAME }}
